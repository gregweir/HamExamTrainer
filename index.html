<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Tartanleaf Ham Exam Trainer</title>
    <meta
      name="description"
      content="Offline-first study trainer for US and Canadian amateur radio license exams, by Tartanleaf."
    />
    <link rel="icon" href="./favicon.ico" />
    <!-- iOS Safari reads apple-touch-icon (NOT the manifest icons) when the
         user adds the trainer to the Home Screen; without this link it
         screenshots the page instead. iOS rounds/fills the icon itself; the
         192px Tartanleaf leaf sits on a solid background, which is what iOS
         expects (fully transparent icons render as black slabs). -->
    <link rel="apple-touch-icon" href="/trainer/pwa-192.png" />
